name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Intel DMG)
    # GitHub macos-26 runners are arm64. Run tests natively, then cross-compile
    # the trait-free Intel release and package PalmierPro-Intel.dmg.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Show toolchain
        run: |
          swift --version
          uname -m

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Check localization
        run: |
          localization_args=()
          if [[ "${{ github.event_name }}" == "pull_request" ]] &&
             ! git diff --quiet HEAD^1 HEAD -- \
               ':(glob)Sources/PalmierPro/Resources/Localization/*.lproj/*.strings' \
               ':(exclude,glob)Sources/PalmierPro/Resources/Localization/en.lproj/*.strings'; then
            localization_args+=(--require-complete)
          fi
          scripts/localization/sync.sh "${localization_args[@]}"
          git diff --exit-code -- Sources/PalmierPro/Resources/Localization/en.lproj/Localizable.strings

      - name: Test
        run: swift test

      - name: Bundle Intel DMG
        run: scripts/bundle.sh release --intel --dmg

      - name: Verify Intel binary
        run: |
          archs="$(lipo -archs .build/PalmierPro.app/Contents/MacOS/PalmierPro)"
          echo "architectures: $archs"
          echo "$archs" | grep -qw x86_64
          test -f .build/PalmierPro-Intel.dmg

      - name: Upload PalmierPro-Intel.dmg
        uses: actions/upload-artifact@v4
        with:
          name: PalmierPro-Intel
          path: .build/PalmierPro-Intel.dmg
          if-no-files-found: error
